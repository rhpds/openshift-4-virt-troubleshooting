  description: "A 120-minute hands-on Day 2 operations lab where participants troubleshoot\
    \ intentionally broken OpenShift Virtualization environments that mirror real\
    \ production incidents. Rather than following predefined commands, attendees learn\
    \ a structured diagnostic workflow using oc, virtctl, Kubernetes events, VirtualMachineInstance\
    \ (VMI) objects, CDI resources, Multus networking, and virt-launcher logs. Across\
    \ five labs, they diagnose and resolve VM startup failures, CDI/DataVolume import\
    \ failures, live-migration failures, network isolation issues, and guest agent\
    \ synchronization gaps \u2014 finishing with a practical troubleshooting methodology\
    \ they can apply in production."
  contributors:
