# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "openshift-5-virt"
  owner_email: "jboeselm@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "gitops"
  description: "This hands-on lab puts attendees into a realistic customer environment running virtual machines and container workloads across OpenShift. They will investigate a connectivity and infrastructure issue, use OpenShift 5 AI-assisted capabilities to help with troubleshooting, validate the findings against real cluster data, and implement the appropriate fix.  The lab will also cover areas that have improved from OpenShift 4, including virtual machine networking, observability, resource optimisation, cluster management and workload mobility. Attendees will then assess a second cluster and perform a controlled workload migration.  The focus is on practical consulting skills rather than a product walkthrough: understand the problem, gather evidence, make the change and prove the outcome. "
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1220"
  workflow_id: "f27392bf-2e90-4efe-b7a3-501af7d4eb52"

spec:
  title: "OpenShift 5 Virtualization in Practice: Troubleshooting, Networking & Workload Mobility"
  learning_objectives:
    - "Configure cluster sizing for an OpenShift Virtualization deployment using AI-assisted capacity planning"
    - "Troubleshoot workload failures using AI-assisted diagnostics (OpenShift Lightspeed)"
    - "Implement network isolation using UserDefinedNetworks (UDN)"
    - "Scale VM resources appropriately using built-in observability"
    - "Analyze cluster readiness for workload migration by profiling node capacity, storage compatibility, and network configuration"
  modules:              # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
    - id: module-01
      title: "AI-Assisted Sizing"
      duration_min: 30
      status: not_started
    - id: module-02
      title: "AI-Assisted Troubleshooting"
      duration_min: 30
      status: not_started
    - id: module-03
      title: "Networking Troubleshooting and Isolation"
      duration_min: 20
      status: not_started
    - id: module-04
      title: "Resource Observability and Troubleshooting"
      duration_min: 20
      status: not_started
    - id: module-05
      title: "Migration Readiness Assessment"
      duration_min: 15
      status: not_started
    - id: module-06
      title: "Workload Migration"
      duration_min: 5
      status: not_started
  environment:
    platform: ""               # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "intermediate"               # beginner | intermediate | advanced

development:
  automation:
    gitops:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Trust-based for most modules — students validate fixes visually via cluster state and console output. Module 5 uses a self-completed readiness checklist; Module 6 is a guided Arcade simulation with built-in progression checks."
    catalog_gap: "Existing catalog labs cover pieces of this design (UDN isolation, resource observability/right-sizing, MTV migration, RHACM multi-cluster management) but none combine OpenShift Lightspeed AI-assisted sizing and troubleshooting with UDN isolation and migration readiness assessment in a single intermediate-level, ~2-hour flow. This lab also evolves the existing openshift-cnv.ocp-virt-roadshow-2026 base pattern rather than duplicating it."
    design_overview: "A 2-hour intermediate hands-on lab where attendees troubleshoot a connectivity/infrastructure issue in an OpenShift Virtualization environment using AI-assisted capabilities (OpenShift Lightspeed), then apply UDN network isolation, right-size VM resources via built-in observability, and finish by assessing a second cluster's migration readiness and performing a guided cross-cluster VM migration simulation with MTV."
    module_summaries:
      - title: "AI-Assisted Sizing"
        overview: "Student translates a simulated VMware estate into an OpenShift Virtualization cluster size using Lightspeed, then validates against Red Hat sizing guidance."
      - title: "AI-Assisted Troubleshooting"
        overview: "A VM workload is down; student uses Lightspeed plus events/logs/conditions to find and fix the root cause, then proves recovery."
      - title: "Networking Troubleshooting and Isolation"
        overview: "Student identifies an unwanted VM-to-service connectivity issue and implements UDN to enforce proper network segmentation."
      - title: "Resource Observability and Troubleshooting"
        overview: "Student uses OCP console dashboards to find and right-size an over-provisioned VM, then creates a PrometheusRule alert for memory threshold."
      - title: "Migration Readiness Assessment"
        overview: "Student profiles a second cluster's node capacity, storage classes, CSI snapshot support, network CNI type, and VM guest OS compatibility to produce a go/no-go migration recommendation."
      - title: "Workload Migration"
        overview: "Guided interactive (Arcade) simulation of a cross-cluster VM migration using MTV."
    rcars_overlap_pct: 82
    rcars_top_matches:
      - title: "Experience OpenShift Virtualization: Advanced Operations and Automation"
        ci_name: "openshift-cnv.ocp-virt-advanced-ops.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.ocp-virt-advanced-ops.prod"
        relevance_score: 82
        why_it_fits: "Covers User Defined Networks (UDN) for network isolation, VM performance observability and resource right-sizing, and multi-cluster VM management within an OpenShift Virtualization context."
      - title: "Experience OpenShift Virtualization: Advanced Operations and Automation - Shared RHACM HUB"
        ci_name: "openshift-cnv.ocp-virt-advanced-ops-hub.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.ocp-virt-advanced-ops-hub.prod"
        relevance_score: 80
        why_it_fits: "Covers UDN for VM network isolation, KubeVirt metrics/PromQL-based resource observability, and multi-cluster VM management with RHACM."
      - title: "LB1839 - Beyond the basics: Operationalizing Red Hat OpenShift Virtualization"
        ci_name: "summit-2026.lb1839-balance-virt-fallback.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=summit-2026.lb1839-balance-virt-fallback.prod"
        relevance_score: 72
        why_it_fits: "Covers OpenShift Virtualization, Migration Toolkit for Virtualization, cross-cluster VM migration, and resource management with hands-on operational depth on migration readiness and right-sizing."
        workloads:
          - role: "ocp4_workload_authentication"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_cert_manager"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_external_odf"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_gitops_bootstrap"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_ocp_console_embed"
            collection: "agnosticd.showroom"
          - role: "ocp4_workload_openshift_gitops"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_showroom"
            collection: "agnosticd.showroom"
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
