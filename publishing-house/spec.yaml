spec:
  title: 'OpenShift Virtualization Troubleshooting Workshop: Diagnosing Real Production
    Failures'
  learning_objectives:
  - Follow a structured troubleshooting workflow for OpenShift Virtualization using
    oc and virtctl
  - Diagnose VM startup and provisioning failures by inspecting VM/VMI lifecycle,
    Events, and virt-launcher logs
  - Troubleshoot CDI image imports and DataVolumes, including WaitForFirstConsumer
    deadlocks and registry access failures
  - Investigate live migration failures caused by storage, networking, CPU, and host-device
    constraints
  - Debug VM networking using Multus NetworkAttachmentDefinitions, NMState, and NetworkPolicies
  - Validate QEMU Guest Agent communication and restore Day 2 operational features
  modules:
  - id: module-01
    title: VM Stuck in Starting
    duration_min: 25
    status: not_started
  - id: module-02
    title: CDI Import Failures
    duration_min: 25
    status: not_started
  - id: module-03
    title: Live Migration Failures
    duration_min: 25
    status: not_started
  - id: module-04
    title: Network Troubleshooting
    duration_min: 25
    status: not_started
  - id: module-05
    title: Guest Agent Failures
    duration_min: 20
    status: not_started
