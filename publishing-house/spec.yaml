# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Trust-based, outcome-driven. Each lab has a clear broken → fixed state that students verify themselves by inspecting cluster state (VM/VMI status, Events, pod logs, connectivity checks). Success in each lab is proven by the VM reaching the expected running/migrated/reachable state after the fix, not by an automated grader."
    catalog_gap: "Existing catalog labs (ocp-virt-roadshow-2026, ocp-virt-advanced-ops) focus on Day 1 deployment and feature walkthroughs of OpenShift Virtualization. None deliver a dedicated Day 2 troubleshooting methodology across the five most common production failure classes — VM startup, CDI imports, live migration, networking, and guest agent — where students diagnose intentionally broken environments rather than follow happy-path steps. This lab reuses the ocp-virt-roadshow-2026 infrastructure base (kubevirt, mtv, nmstate, network bridges, roadshow VMs) but reorients the content entirely around structured diagnosis and remediation."
    design_overview: "A 120-minute intermediate, fully hands-on Day 2 operations lab. Attendees troubleshoot intentionally broken OpenShift Virtualization environments that mirror real production incidents across five labs: (1) VM stuck in Starting, (2) CDI import failures, (3) live migration failures, (4) network isolation/connectivity, and (5) guest agent failures. Rather than following predefined commands, students learn a structured diagnostic workflow using oc, virtctl, Kubernetes events, VMI objects, CDI resources, Multus networking, and virt-launcher logs, and finish with a reusable troubleshooting methodology."
    module_summaries:
      - title: "VM Stuck in Starting"
        overview: "A VM never progresses beyond Starting because the launcher pod cannot be scheduled or initialized. Student inspects VM/VMI lifecycle, Events, and virt-launcher logs to find the root cause — missing PVC/DataVolume, resource shortage (CPU/memory/hugepages), ContainerDisk pull failure, or invalid cloud-init — and fixes it."
      - title: "CDI Import Failures"
        overview: "VM provisioning fails because the DataVolume import never completes. Student inspects DataVolumes and importer pods and analyzes PVC events to diagnose WaitForFirstConsumer deadlocks, missing scratch space, registry certificate problems, or authentication/network access failures, then configures CDI storage correctly."
      - title: "Live Migration Failures"
        overview: "Live migration fails during node maintenance due to infrastructure constraints. Student analyzes migration events and validates shared storage to diagnose ReadWriteOnce limitations, a missing migration network, CPU incompatibilities, or SR-IOV/GPU/host-device dependencies, and applies the correct migration prerequisites."
      - title: "Network Troubleshooting"
        overview: "A VM is running but cannot communicate with external systems or cluster resources. Student inspects VM interfaces, validates Multus NetworkAttachmentDefinitions and NMState bridge config, and traces packet flow to diagnose incorrect bindings, broken NADs, bridge issues, or restrictive NetworkPolicies."
      - title: "Guest Agent Failures"
        overview: "The VM is operational, but platform integrations (graceful shutdown, IP reporting, memory ballooning) do not work. Student validates guest agent connectivity to diagnose a missing/disabled QEMU Guest Agent, a missing VirtIO channel, or SELinux/firewall restrictions, and restores Day 2 management features."
    rcars_overlap_pct: 0
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: "openshift_cnv.ocp-virt-roadshow-2026"
