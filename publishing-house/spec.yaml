project:
  slug: "openshift-5-virt"
  owner_email: "jboeselm@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "both"
  description: "A 120-minute hands-on Day 2 operations lab where participants troubleshoot intentionally broken OpenShift Virtualization environments that mirror real production incidents. Rather than following predefined commands, attendees learn a structured diagnostic workflow using oc, virtctl, Kubernetes events, VirtualMachineInstance (VMI) objects, CDI resources, Multus networking, and virt-launcher logs. Across five labs, they diagnose and resolve VM startup failures, CDI/DataVolume import failures, live-migration failures, network isolation issues, and guest agent synchronization gaps — finishing with a practical troubleshooting methodology they can apply in production."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1220"
  workflow_id: "f27392bf-2e90-4efe-b7a3-501af7d4eb52"

spec:
  title: "OpenShift Virtualization Troubleshooting Workshop: Diagnosing Real Production Failures"
  learning_objectives:
    - "Follow a structured troubleshooting workflow for OpenShift Virtualization using oc and virtctl"
    - "Diagnose VM startup and provisioning failures by inspecting VM/VMI lifecycle, Events, and virt-launcher logs"
    - "Troubleshoot CDI image imports and DataVolumes, including WaitForFirstConsumer deadlocks and registry access failures"
    - "Investigate live migration failures caused by storage, networking, CPU, and host-device constraints"
    - "Debug VM networking using Multus NetworkAttachmentDefinitions, NMState, and NetworkPolicies"
    - "Validate QEMU Guest Agent communication and restore Day 2 operational features"
  modules:              # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
    - id: module-01
      title: "VM Stuck in Starting"
      duration_min: 25
      status: not_started
    - id: module-02
      title: "CDI Import Failures"
      duration_min: 25
      status: not_started
    - id: module-03
      title: "Live Migration Failures"
      duration_min: 25
      status: not_started
    - id: module-04
      title: "Network Troubleshooting"
      duration_min: 25
      status: not_started
    - id: module-05
      title: "Guest Agent Failures"
      duration_min: 20
      status: not_started
  environment:
    platform: "ocp"               # ocp | rhel-vms — determines which sizing fields apply
    topology: "shared-cluster"               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: 20 # required if topology = shared-cluster — up to 20 users per cluster (ocp-virt-roadshow-2026 base CI)

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.21"                    # from base CI ocp4_installer_version 4.21.10 — GA
    cluster_type: "multinode"                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: 3 # 1 if sno, 3 if multinode
    control_plane_cpu: 16            # ai_control_plane_cores when workers <= 10
    control_plane_ram_gb: 32         # ai_control_plane_memory 32Gi when workers <= 10
    worker_count: 3                 # worker_instance_count = max(ceil(num_users/5), 3)
    worker_cpu: 16                  # ai_workers_cores
    worker_ram_gb: 64                # ai_workers_memory 64Gi
    worker_disk_gb: 100               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products — N/A, not used
    ai_requirement: "none"                 # maas | gpu | none — no AI/Lightspeed in this lab
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []             # OCP 4.21 is GA — no non-GA products
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:              # named external service dependencies e.g. [github.com]
      - "registry.redhat.io / registry.access.redhat.com (container image and ContainerDisk pulls)"
      - "mirror.openshift.com (OCP installer clients)"
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "intermediate"               # beginner | intermediate | advanced

