# Task 3: Missing Cloud-Init Secret.
#
# References a Secret (`user-credentials`) that is deliberately never
# created here -- the student creates it, with the cloud-init userdata, as
# the fix.
#
# runStrategy: Always -- the student must find the VM already stuck, not
# trigger the failure themselves.
#
# ASSUMPTION -- flagged for review: the dataVolumeTemplate sourceRef assumes
# the cluster has the default CNV boot-source import enabled, so the
# "fedora" DataSource exists in openshift-virtualization-os-images (same
# assumption as vm-scheduling.yaml).
#
# CRD comes from CNV; SkipDryRunOnMissingResource required.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-cloudinit
  namespace: {{ .Values.username }}-vm-troubleshoot
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: vm-cloudinit-disk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  runStrategy: Always
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: fedora
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/domain: vm-cloudinit
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              name: default
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        machine:
          type: pc-q35-rhel9.4.0
        memory:
          guest: 2Gi
        resources: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - dataVolume:
            name: vm-cloudinit-disk
          name: rootdisk
        - cloudInitNoCloud:
            secretRef:
              name: user-credentials
          name: cloudinitdisk
