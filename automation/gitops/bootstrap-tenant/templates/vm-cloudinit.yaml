# Task 3: Missing Cloud-Init Secret.
#
# References a Secret (`user-credentials`) that is deliberately never
# created here -- the student creates it, with the cloud-init userdata, as
# the fix.
#
# runStrategy: Always -- the student must find the VM already stuck, not
# trigger the failure themselves.
#
# The dataVolumeTemplate sourceRef assumes the cluster has the default CNV
# boot-source import enabled, so the "fedora" DataSource exists in
# openshift-virtualization-os-images -- confirmed Ready on this cluster
# (2026-09-21), same as vm-scheduling.yaml.
#
# evictionStrategy: None -- see vm-scheduling.yaml for why (confirmed live:
# a sibling VM's stuck pod under this cluster's default LiveMigrate strategy
# wedged a node's MCO drain for over an hour).
#
# CRD comes from CNV; SkipDryRunOnMissingResource required.
#
# ignore-healthcheck -- this VM is *meant* to stay unhealthy
# (FailedMount on the missing secret) until the student fixes it, otherwise
# ArgoCD's generic health check marks the Application Degraded for the whole
# exercise. (Correction: an earlier version used a "DisableResourceHealthCheck"
# sync option that doesn't exist in ArgoCD -- see vm-scheduling.yaml for the
# verified real mechanism.)
# No ignore-differences needed here: the fix is creating the missing
# `user-credentials` Secret, never editing this VM's own spec, so there's
# nothing for selfHeal to revert.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-cloudinit
  namespace: {{ .Values.username }}-vm-troubleshoot
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: vm-cloudinit-disk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  runStrategy: Always
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: fedora
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/domain: vm-cloudinit
    spec:
      architecture: amd64
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              name: default
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        machine:
          type: pc-q35-rhel9.4.0
        memory:
          guest: 2Gi
        resources: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - dataVolume:
            name: vm-cloudinit-disk
          name: rootdisk
        - cloudInitNoCloud:
            secretRef:
              name: user-credentials
          name: cloudinitdisk
