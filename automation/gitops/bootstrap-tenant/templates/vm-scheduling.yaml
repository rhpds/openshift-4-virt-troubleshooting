# Generated from https://github.com/rhpds/rhdp-gitops-patterns/examples/ocp-virt-lab
# (VM shape) adapted for Task 1: Scheduling Failure (Resource Constraints).
#
# dedicatedCpuPlacement requires the static CPU manager KubeletConfig from
# bootstrap-infra. The oversized memory request below (not the CPU pinning
# itself) is what makes this unschedulable on any node -- the fix is
# lowering it, matching the module's documented fix path.
#
# runStrategy: Always -- the student must find the VM already stuck, not
# trigger the failure themselves (matches the module outline's step 1:
# "List VMs and note the VM stuck in Starting").
#
# The dataVolumeTemplate sourceRef assumes the cluster has the default CNV
# boot-source import enabled, so the "fedora" DataSource exists in
# openshift-virtualization-os-images -- confirmed Ready on this cluster
# (2026-09-21), but re-verify on any base CI that doesn't enable common boot
# images (`ocp4_workload_virt_roadshow_vms`), since this DataVolume would
# otherwise hang instead of producing the intended scheduling fault.
#
# evictionStrategy: None -- confirmed live (2026-09-21) that this cluster's
# HyperConverged default is LiveMigrate. This VM can never live-migrate
# (dedicatedCpuPlacement + local DataVolume), so with the default, any node
# drain targeting it hangs forever instead of just deleting/rescheduling the
# pod -- observed live: it wedged the CPU-manager KubeletConfig's
# MachineConfigPool rollout (drain stuck >1h on a stuck vm-imagepull pod on
# another VM with the same inherited default). Explicit None avoids blocking
# cluster maintenance for every non-migratable lab VM.
#
# CRD comes from CNV; SkipDryRunOnMissingResource required.
#
# ignore-healthcheck -- this VM is *meant* to stay unhealthy
# (Pending/unschedulable) until the student fixes it. Without this, ArgoCD's
# generic health check reads the VMI's Ready=False condition and marks the
# Application Degraded for the entire duration of the exercise. (Correction:
# an earlier version of this file used a "DisableResourceHealthCheck" sync
# option that doesn't exist in ArgoCD -- verified against
# https://argo-cd.readthedocs.io/en/stable/operator-manual/health/, the real
# mechanism is this annotation.)
#
# Protecting the student's memory-request fix from a future auto-sync is
# handled at the Application level, not here. A per-resource
# argocd.argoproj.io/ignore-differences annotation was tried first and
# confirmed BROKEN live (2026-09-21): it was only merged into ArgoCD
# upstream the same day as this cluster's OpenShift GitOps build, and
# watching it fail end-to-end proved it -- fixed this VM's memory as a
# student would, then a routine refresh (no new git commit) triggered this
# Application's existing automated sync and silently reverted the live
# value back to 999Gi. The working, version-independent mechanism is the
# Application's own spec.ignoreDifferences field (already used by the
# deployer for other entries, confirmed functioning) -- see
# ../argocd-self-patch/ for the Sync-phase hook Job (ordered before this VM
# via sync-wave, not PostSync -- see that file for why) that keeps this
# tenant's own Application's ignoreDifferences current with the entry this
# VM needs.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-scheduling
  namespace: {{ .Values.username }}-vm-troubleshoot
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: vm-scheduling-disk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  runStrategy: Always
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: fedora
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/domain: vm-scheduling
    spec:
      architecture: amd64
      evictionStrategy: None
      domain:
        cpu:
          cores: 2
          sockets: 1
          threads: 1
          dedicatedCpuPlacement: true
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              name: default
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        machine:
          type: pc-q35-rhel9.4.0
        memory:
          guest: {{ .Values.vmScheduling.memory }}
        resources: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - dataVolume:
            name: vm-scheduling-disk
          name: rootdisk
        - cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: fedora
              password: redhat
              chpasswd: { expire: False }
          name: cloudinitdisk
