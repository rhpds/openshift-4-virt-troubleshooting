# Lets this tenant's PostSync hook Job (job.yaml) patch its own Application
# object's spec.ignoreDifferences -- see job.yaml for why.
#
# ClusterRole/ClusterRoleBinding (not a namespaced Role) because the target
# Application lives in openshift-gitops, outside every tenant's own
# namespaces -- a namespaced Role would have to be created directly inside
# openshift-gitops, which the tenant-namespace-isolation convention rules
# out. Scoped down via resourceNames to exactly this tenant's own
# Application name, so this tenant's ServiceAccount can only ever patch its
# own Application, not anyone else's.
#
# ASSUMPTION -- flagged for review: resourceNames matches by object name
# only, not namespace (Kubernetes RBAC has no per-object namespace
# restriction on ClusterRoles). This grants patch on any "Application"
# object cluster-wide literally named "bootstrap-<this tenant's guid>" --
# acceptable on this disposable lab cluster where Applications only ever
# live in openshift-gitops, but worth knowing if this pattern is reused
# somewhere with a less contained trust boundary.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-self-patch
  namespace: {{ .Values.username }}-vm-troubleshoot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-self-patch-{{ .Values.username }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["bootstrap-{{ .Values.deployer.guid }}"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-self-patch-{{ .Values.username }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-self-patch-{{ .Values.username }}
subjects:
  - kind: ServiceAccount
    name: argocd-self-patch
    namespace: {{ .Values.username }}-vm-troubleshoot
