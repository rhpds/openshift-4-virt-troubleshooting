# Task 2: Container Disk Image Pull Failure.
#
# containerDisk points at the shared private registry provisioned by
# bootstrap-infra (see ../bootstrap-infra/templates/registry/), exposed via
# its Route (see ../bootstrap-infra/templates/registry/route.yaml). No pull
# secret is linked in this namespace -- the student must create a
# docker-registry Secret from the shared registry credential and link it to
# the default ServiceAccount before this VM can start.
#
# CORRECTION (confirmed live 2026-09-21): this used to point at the
# in-cluster Service DNS name (vm-registry.vm-registry.svc.cluster.local).
# That is NOT resolvable during a containerDisk pull -- kubelet/CRI-O pulls
# images using the *node's* network namespace and /etc/resolv.conf, before
# any pod network (and therefore CoreDNS) exists for the pod being created.
# Every worker failed with "no such host" on that name. The image-sync Job
# in bootstrap-infra still uses the internal Service DNS correctly, because
# it runs as a pod (pod network -> CoreDNS works there); only this
# node-level pull needed the externally-resolvable Route host instead.
#
# runStrategy: Always -- the student must find the VM already stuck, not
# trigger the failure themselves.
#
# evictionStrategy: None -- see vm-scheduling.yaml for why (confirmed live:
# this exact VM's stuck pod is what wedged a node's MCO drain for over an
# hour under the cluster's default LiveMigrate eviction strategy).
#
# CRD comes from CNV; SkipDryRunOnMissingResource required.
#
# ignore-healthcheck -- this VM is *meant* to stay unhealthy
# (ImagePullBackOff) until the student fixes it, otherwise ArgoCD's generic
# health check marks the Application Degraded for the whole exercise.
# (Correction: an earlier version used a "DisableResourceHealthCheck" sync
# option that doesn't exist in ArgoCD -- see vm-scheduling.yaml for the
# verified real mechanism.)
# No ignore-differences needed here: the fix (docker-registry Secret +
# `oc secrets link default ... --for=pull`) never touches this VM's own
# spec, so there's nothing for selfHeal to revert.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-imagepull
  namespace: {{ .Values.username }}-vm-troubleshoot
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  runStrategy: Always
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: centos-stream9
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/domain: vm-imagepull
    spec:
      architecture: amd64
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: containerdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              name: default
          rng: {}
        features:
          acpi: {}
        machine:
          type: pc-q35-rhel9.4.0
        memory:
          guest: 2Gi
        resources: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - name: containerdisk
          containerDisk:
            image: vm-registry.{{ .Values.deployer.domain }}/{{ .Values.registryImagePath }}:{{ .Values.registryImageTag }}
        - cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: cloud-user
              password: redhat
              chpasswd: { expire: False }
          name: cloudinitdisk
