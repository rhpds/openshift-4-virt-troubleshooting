{{- if .Values.argocdTenantPatch.enabled }}
# Keeps every tenant Application's spec.ignoreDifferences up to date with the
# entries this module's VMs need, without touching individual tenant charts
# or the cluster-wide ArgoCD instance (spec.resourceIgnoreDifferences on the
# ArgoCD CR would also work and only needs setting once, but is cluster-wide
# in scope; this stays scoped to just the tenant Applications).
#
# CORRECTION (confirmed live 2026-09-21): a per-resource
# argocd.argoproj.io/ignore-differences annotation (see
# ../../../bootstrap-tenant/templates/vm-scheduling.yaml) was tried first and
# does not take effect on this cluster's ArgoCD build. The Application-level
# spec.ignoreDifferences field is the verified-working mechanism -- deployer-
# set entries were already present and functioning on every tenant
# Application before this chart added anything.
#
# Uses a targeted JSON Patch "add" (append to the array, or create the array
# if absent) rather than a full apply of spec.ignoreDifferences -- that field
# has no merge-key semantics, so a full apply/replace would silently wipe
# any other entries the deployer sets (already observed: two pre-existing
# ConfigMap entries on every tenant Application). The patch only ever adds;
# it checks first and skips Applications that already have the entry, so
# each Application is changed at most once, not on every run.
#
# Runs on a schedule (not once) because tenant Applications are created
# progressively as students are provisioned, after this chart's own one-time
# sync -- a single PostSync hook here would miss every tenant created
# afterward.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-tenant-patch
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  schedule: {{ .Values.argocdTenantPatch.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: argocd-tenant-patch
          restartPolicy: Never
          containers:
            - name: patch
              image: {{ .Values.argocdTenantPatch.image }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  patch_value='{"group":"kubevirt.io","kind":"VirtualMachine","name":"vm-scheduling","jsonPointers":["/spec/template/spec/domain/memory"]}'
                  apps=$(oc get applications.argoproj.io -n openshift-gitops \
                    -o jsonpath='{range .items[?(@.spec.project=="tenants")]}{.metadata.name}{"\n"}{end}')
                  if [ -z "$apps" ]; then
                    echo "no tenant Applications found yet"
                    exit 0
                  fi
                  for app in $apps; do
                    current=$(oc get application "$app" -n openshift-gitops -o jsonpath='{.spec.ignoreDifferences}')
                    case "$current" in
                      *vm-scheduling*)
                        echo "skip $app: already patched"
                        ;;
                      "")
                        echo "patch $app: creating ignoreDifferences array"
                        oc patch application "$app" -n openshift-gitops --type=json \
                          -p="[{\"op\":\"add\",\"path\":\"/spec/ignoreDifferences\",\"value\":[$patch_value]}]"
                        ;;
                      *)
                        echo "patch $app: appending to existing ignoreDifferences"
                        oc patch application "$app" -n openshift-gitops --type=json \
                          -p="[{\"op\":\"add\",\"path\":\"/spec/ignoreDifferences/-\",\"value\":$patch_value}]"
                        ;;
                    esac
                  done
{{- end }}
