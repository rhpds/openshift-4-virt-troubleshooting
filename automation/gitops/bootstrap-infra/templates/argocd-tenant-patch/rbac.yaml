{{- if .Values.argocdTenantPatch.enabled }}
# RBAC for the CronJob below. Scoped to exactly what it needs: get/list/patch
# on Applications, in the openshift-gitops namespace only -- not cluster-wide.
# Lives in openshift-gitops (not a tenant namespace) because its job is
# literally to manage every tenant Application from one place; this is the
# same "infra = cluster-wide/shared" reasoning as the KubeletConfig and
# registry Image config elsewhere in this chart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-tenant-patch
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-tenant-patch
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-tenant-patch
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-tenant-patch
subjects:
  - kind: ServiceAccount
    name: argocd-tenant-patch
    namespace: openshift-gitops
{{- end }}
