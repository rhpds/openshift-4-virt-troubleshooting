{{- if .Values.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-registry
  namespace: {{ .Values.registry.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: vm-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vm-registry
  template:
    metadata:
      labels:
        app: vm-registry
    spec:
      containers:
        - name: registry
          image: {{ .Values.registry.image }}
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: "VM Troubleshooting Registry"
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
          volumeMounts:
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: storage
              mountPath: /var/lib/registry
      volumes:
        - name: auth
          secret:
            secretName: vm-registry-htpasswd
            items:
              - key: htpasswd
                path: htpasswd
        - name: storage
          persistentVolumeClaim:
            claimName: vm-registry-storage
{{- end }}
