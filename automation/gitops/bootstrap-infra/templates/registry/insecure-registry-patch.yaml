{{- if .Values.registry.enabled }}
# Nodes must be told to trust the registry's Route as insecure -- its edge
# Route (route.yaml) terminates TLS with the router's own certificate
# (typically self-signed on RHDP clusters), and CRI-O will otherwise refuse
# to pull the containerDisk image referenced by the "vm-imagepull" tenant VM.
#
# CORRECTION (confirmed live 2026-09-21): this used to list the in-cluster
# Service DNS host (vmtroubleshoot.registryHost). That's irrelevant here --
# node-level image pulls can't resolve it at all (see route.yaml) -- so this
# now lists the externally-resolvable Route host that pulls actually target.
#
# ASSUMPTION -- flagged for review: this REPLACES the entire
# spec.registrySources.insecureRegistries list on this cluster-wide singleton.
# If other insecure registries are already configured here, merge them into
# this list manually before syncing this chart.
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  registrySources:
    insecureRegistries:
      - {{ include "vmtroubleshoot.registryExternalHost" . }}
{{- end }}
