# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

# Shared namespace for tenant cleanup jobs. Set to "" to disable.
tenantLifecycle: ""
# tenantLifecycle:
#   namespace: tenant-lifecycle

# --- "Lab 1: VM Stuck in Starting" module ---

# Task 1 (Scheduling Failure): static CPU manager on the standard `worker`
# MachineConfigPool -- no custom pool, no hardcoded node hostnames, so it
# applies uniformly regardless of how many workers this cluster has.
# WARNING: enabling this KubeletConfig triggers a rolling reboot of every
# worker node via the Machine Config Operator. Apply once during cluster
# bring-up, before students arrive -- this is not something to re-sync per
# lab run.
cpuManager:
  enabled: true

# Task 2 (Container Disk Image Pull Failure): a small in-cluster private
# registry hosting the VM container-disk image, shared by every student.
# CORRECTION (confirmed live 2026-09-21): this used to say no Route was
# needed since only nodes need to pull the image, not browse it externally.
# That's backwards -- node-level image pulls are exactly what needs a Route
# (see templates/registry/route.yaml): CRI-O pulls using the node's own DNS,
# which cannot resolve the in-cluster Service DNS at all.
registry:
  enabled: true
  namespace: vm-registry
  storage: 10Gi
  # ASSUMPTION -- flagged for review: pulled from docker.io, which is not on
  # this project's approved external_services list in spec.yaml (only
  # registry.redhat.io/registry.access.redhat.com and mirror.openshift.com
  # are listed, alongside quay.io already used for sourceImage below). Add
  # docker.io and quay.io to spec.yaml's external_services for infra review,
  # or swap this for a Red Hat-hosted registry image if egress is restricted.
  image: docker.io/library/registry:2
  # Single shared credential every student uses to build their own pull
  # secret (matches the module design: "all users access the same image").
  # Intentionally not sensitive -- this registry only ever holds one public,
  # freely redistributable container-disk image, on a disposable lab cluster.
  auth:
    username: student
    password: StudentReg1stry!
    # bcrypt htpasswd line for the password above (`htpasswd -Bbn student ...`),
    # embedded in the registry's htpasswd auth file. Regenerate both together
    # if you change the password.
    htpasswdHash: 'student:$2y$05$rxEtsC576xOmp63UrnjKjeZlBE5C7zSeMyfus9p/TOcyKUuYRi3.C'
  # ASSUMPTION -- flagged for review: the module doc references "the same
  # image mentioned in [the 'Creating VMs from Container Disks' doc]" without
  # naming it. Using a well-known public container-disk image as a stand-in;
  # swap for the exact one the module content ends up citing.
  sourceImage: quay.io/containerdisks/centos-stream:9
  imagePath: vm-images/centos-stream9
  imageTag: latest
  syncImage: registry.redhat.io/rhel9/skopeo:latest

# ASSUMPTION -- flagged for review: this cluster-wide Image config resource
# replaces the *entire* registrySources.insecureRegistries list. If this
# shared cluster already has other entries there, merge them in manually
# before this chart is synced, or this will drop them.
