---
- name: Create Role for NAD management
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: nad-editor
        namespace: "{{ bootstrap_tenant_username }}-troubleshoot-02"
      rules:
        - apiGroups:
            - "k8s.cni.cncf.io"
          resources:
            - network-attachment-definitions
          verbs:
            - get
            - list
            - watch
            - create
            - update
            - patch
            - delete

- name: Create RoleBinding for NAD management
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: nad-editor-binding
        namespace: "{{ bootstrap_tenant_username }}-troubleshoot-02"
      subjects:
        - kind: User
          name: "{{ bootstrap_tenant_username }}"
      roleRef:
        kind: Role
        name: nad-editor
        apiGroup: rbac.authorization.k8s.io

- name: Create healthy-flat-net network attachment definition
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.cni.cncf.io/v1
      kind: NetworkAttachmentDefinition
      metadata:
        annotations:
          k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br0
        name: healthy-flat-net
        namespace: "{{ bootstrap_tenant_username }}-troubleshoot-02"
      spec:
        config: |
          {
            "name":"healthy-flat-net",
            "type":"bridge",
            "cniVersion":"0.3.1",
            "bridge":"br0",
            "macspoofchk":true,
            "ipam":{},
            "preserveDefaultVlan":false
          }

- name: Create vm-private-net network attachment definition (With Typo Fault)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.cni.cncf.io/v1
      kind: NetworkAttachmentDefinition
      metadata:
        annotations:
          k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br0
        name: vm-private-net
        namespace: "{{ bootstrap_tenant_username }}-troubleshoot-02"
      spec:
        config: |
          {
            "name":"vm-private-net",
            "type":"bridge",
            "cniVersion":"0.3.1",
            "bridge":"br0-typo",
            "macspoofchk":true,
            "ipam":{},
            "preserveDefaultVlan":false
          }

- name: Deploy broken VM scheduling failure - dynamic network
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'vm-network.yaml.j2') }}"

- name: Deploy broken VM scheduling failure - static network
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'vm-static-network.yaml.j2') }}"


