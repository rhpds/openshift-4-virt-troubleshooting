---
- name: Print bootstrap_tenant variables
  ansible.builtin.debug:
    msg:
      username: "{{ bootstrap_tenant_username }}"
      _agnosticd_user_data: "{{ lookup('agnosticd.core.agnosticd_user_data', '*') }}"

- name: Grant Quay access
  ansible.builtin.include_tasks: grant_quay_access.yml

- name: "Deploy broken VM scheduling failure"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'vm-scheduling.yaml.j2') }}"

- name: "Deploy broken VM image pull failure"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'vm-imagepull.yaml.j2') }}"

- name: "Deploy broken VM missing cloud-init secret"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'vm-cloudinit.yaml.j2') }}"
