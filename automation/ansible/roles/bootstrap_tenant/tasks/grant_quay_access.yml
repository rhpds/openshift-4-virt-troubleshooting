---
- name: Get Quay admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-admin-credentials
    namespace: quay
  register: r_quay_admin_secret

- name: Set Quay admin credentials and API URL
  ansible.builtin.set_fact:
    _bootstrap_tenant_quay_admin_user: "{{ r_quay_admin_secret.resources[0].data.username | b64decode | trim }}"
    _bootstrap_tenant_quay_admin_password: "{{ r_quay_admin_secret.resources[0].data.password | b64decode | trim }}"
  no_log: true

- name: Get initial CSRF token
  ansible.builtin.uri:
    url: "{{ bootstrap_tenant_quay_url }}/csrf_token"
    validate_certs: false
    status_code: 200
  register: r_quay_csrf_initial

- name: Sign in to Quay as admin
  ansible.builtin.uri:
    url: "{{ bootstrap_tenant_quay_url }}/api/v1/signin"
    method: POST
    validate_certs: false
    headers:
      Cookie: "{{ r_quay_csrf_initial.cookies_string }}"
      X-CSRF-Token: "{{ r_quay_csrf_initial.json.csrf_token }}"
    body_format: json
    body:
      username: "{{ _bootstrap_tenant_quay_admin_user }}"
      password: "{{ _bootstrap_tenant_quay_admin_password }}"
    status_code: 200
  register: r_quay_signin
  no_log: true

- name: Get authenticated CSRF token
  ansible.builtin.uri:
    url: "{{ bootstrap_tenant_quay_url }}/csrf_token"
    validate_certs: false
    headers:
      Cookie: "{{ r_quay_signin.cookies_string }}"
    status_code: 200
  register: r_quay_csrf_auth

- name: Grant Quay user read access to shared repository
  ansible.builtin.uri:
    url: >-
      {{ bootstrap_tenant_quay_url }}/api/v1/repository/{{
      bootstrap_tenant_quay_organization }}/{{
      bootstrap_tenant_quay_repository }}/permissions/user/{{
      bootstrap_tenant_quay_user }}
    method: PUT
    validate_certs: false
    headers:
      Cookie: "{{ r_quay_signin.cookies_string }}"
      X-CSRF-Token: "{{ r_quay_csrf_auth.json.csrf_token }}"
    body_format: json
    body:
      role: read
    status_code: 200
  register: r_grant_quay_permission
  until: r_grant_quay_permission.status == 200
  retries: 5
  delay: 5
