apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: openshift-5-virt
  title: openshift-5-virt
  description: 'This hands-on lab puts attendees into a realistic customer environment
    running virtual machines and container workloads across OpenShift. They will investigate
    a connectivity and infrastructure issue, use OpenShift 5 AI-assisted capabilities
    to help with troubleshooting, validate the findings against real cluster data,
    and implement the appropriate fix.  The lab will also cover areas that have improved
    from OpenShift 4, including virtual machine networking, observability, resource
    optimisation, cluster management and workload mobility. Attendees will then assess
    a second cluster and perform a controlled workload migration.  The focus is on
    practical consulting skills rather than a product walkthrough: understand the
    problem, gather evidence, make the change and prove the outcome. '
