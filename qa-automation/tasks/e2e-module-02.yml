---
# module-02: vm3 attaches vm-private-net, whose bridge is the typo enp2s0; vm4 runs a web
# server behind vm4-web-svc, whose selector (app=vm4-web) matches no vm4 pod
# (app=vm4-app), so vm4-web-route has no endpoints and returns 503. Follows
# module-02-solution.adoc.
#
# It checks the faults are present and that both fixes are accepted. It does not wait
# for vm3 to recover or for the Route to answer: both take minutes.

- name: Module 2 - VM networking
  vars:
    ns: "{{ user_data.user }}-troubleshoot-02"
  block:

    # vm3
    - name: vm-private-net points at enp2s0
      ansible.builtin.command:
        argv: [oc, get, network-attachment-definitions, vm-private-net, -n, "{{ ns }}", -o, "jsonpath={.spec.config}"]
      register: nad
      failed_when: '"enp2s0" not in nad.stdout'
      changed_when: false

    - name: Point vm-private-net at br0
      kubernetes.core.k8s:
        merge_type: merge
        definition:
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: vm-private-net
            namespace: "{{ ns }}"
          spec:
            config: |
              {
                "name":"vm-private-net",
                "type":"bridge",
                "cniVersion":"0.3.1",
                "bridge":"br0",
                "macspoofchk":true,
                "ipam":{},
                "preserveDefaultVlan":false
              }

    - name: vm-private-net now points at br0
      ansible.builtin.command:
        argv: [oc, get, network-attachment-definitions, vm-private-net, -n, "{{ ns }}", -o, "jsonpath={.spec.config}"]
      register: nad_fixed
      failed_when: '"br0" not in nad_fixed.stdout or "enp2s0" in nad_fixed.stdout'
      changed_when: false

    # vm4
    - name: vm4-web-svc selects a label no vm4 pod carries
      ansible.builtin.command:
        argv: [oc, get, svc, vm4-web-svc, -n, "{{ ns }}", -o, "jsonpath={.spec.selector.app}"]
      register: vm4_svc_selector
      failed_when: vm4_svc_selector.stdout != 'vm4-web'
      changed_when: false

    - name: vm4's pod carries the app=vm4-app label
      ansible.builtin.command:
        argv: [oc, get, vm, vm4, -n, "{{ ns }}", -o, "jsonpath={.spec.template.metadata.labels.app}"]
      register: vm4_pod_label
      failed_when: vm4_pod_label.stdout != 'vm4-app'
      changed_when: false

    - name: Point the Service selector at the vm4 pod label
      ansible.builtin.command:
        argv:
          - oc
          - patch
          - svc
          - vm4-web-svc
          - -n
          - "{{ ns }}"
          - --type=merge
          - -p
          - '{"spec":{"selector":{"app":"vm4-app"}}}'

    - name: vm4-web-svc now selects the vm4 pod
      ansible.builtin.command:
        argv: [oc, get, svc, vm4-web-svc, -n, "{{ ns }}", -o, "jsonpath={.spec.selector.app}"]
      register: vm4_svc_fixed
      failed_when: vm4_svc_fixed.stdout != 'vm4-app'
      changed_when: false
