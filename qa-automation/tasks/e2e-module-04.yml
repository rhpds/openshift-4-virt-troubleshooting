---
# module-04: migration-quota at 3500Mi leaves vm6's migration target pod no room, while
# vm7 runs and its required podAffinity to anchor-pod blocks its migration. Follows
# module-04-solution.adoc: raise the quota to 6Gi, then remove vm7's affinity.
#
# It checks both faults are present and that the fixes are accepted. It does not wait
# for the migrations to finish: each takes minutes.

- name: Module 4 - live migration
  vars:
    ns: "{{ user_data.user }}-troubleshoot-04"
  block:

    - name: vm6 runs
      ansible.builtin.command:
        argv: [oc, get, vmi, vm6, -n, "{{ ns }}", -o, "jsonpath={.status.phase}"]
      register: vm6_phase
      until: vm6_phase.stdout == 'Running'
      retries: 12
      delay: 5
      changed_when: false

    - name: migration-quota exists
      ansible.builtin.command:
        argv: [oc, get, resourcequota, migration-quota, -n, "{{ ns }}", -o, name]
      register: migration_quota
      failed_when: false
      changed_when: false

    - name: Check migration-quota is present
      ansible.builtin.assert:
        that: migration_quota.rc == 0
        fail_msg: "module-04: migration-quota is missing; this tenant is not fresh."

    - name: migration-quota is at 3500Mi
      ansible.builtin.command:
        argv: [oc, get, resourcequota, migration-quota, -n, "{{ ns }}", -o, "jsonpath={.spec.hard.requests\\.memory}"]
      register: migration_quota_hard
      failed_when: migration_quota_hard.stdout != '3500Mi'
      changed_when: false

    - name: vm7 runs
      ansible.builtin.command:
        argv: [oc, get, vmi, vm7, -n, "{{ ns }}", -o, "jsonpath={.status.phase}"]
      register: vm7_phase
      until: vm7_phase.stdout == 'Running'
      retries: 24
      delay: 5
      changed_when: false

    - name: vm7 is pinned by its affinity
      ansible.builtin.command:
        argv: [oc, get, vm, vm7, -n, "{{ ns }}", -o, "jsonpath={.spec.template.spec.affinity}"]
      register: vm7_affinity
      failed_when: '"podAffinity" not in vm7_affinity.stdout'
      changed_when: false

    - name: Start the vm6 migration
      kubernetes.core.k8s:
        definition:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachineInstanceMigration
          metadata:
            name: e2e-vm6-migration
            namespace: "{{ ns }}"
          spec:
            vmiName: vm6

    - name: migration-quota rejects the vm6 target pod
      ansible.builtin.command:
        argv:
          - oc
          - get
          - events
          - -n
          - "{{ ns }}"
          - --field-selector
          - reason=FailedCreate
          - -o
          - "jsonpath={range .items[*]}{.message}{\"\\n\"}{end}"
      register: migration_quota_events
      until: "'exceeded quota: migration-quota' in migration_quota_events.stdout"
      retries: 24
      delay: 5
      changed_when: false

    - name: Raise migration-quota to 6Gi
      ansible.builtin.command:
        argv:
          - oc
          - patch
          - resourcequota
          - migration-quota
          - -n
          - "{{ ns }}"
          - --type=merge
          - -p
          - '{"spec":{"hard":{"requests.memory":"6Gi"}}}'

    - name: migration-quota is now 6Gi
      ansible.builtin.command:
        argv: [oc, get, resourcequota, migration-quota, -n, "{{ ns }}", -o, "jsonpath={.spec.hard.requests\\.memory}"]
      register: migration_quota_fixed
      failed_when: migration_quota_fixed.stdout != '6Gi'
      changed_when: false

    - name: Remove the affinity rule
      ansible.builtin.command:
        argv:
          - oc
          - patch
          - vm
          - vm7
          - -n
          - "{{ ns }}"
          - --type=json
          - -p
          - '[{"op": "remove", "path": "/spec/template/spec/affinity"}]'

    - name: vm7 no longer has an affinity
      ansible.builtin.command:
        argv: [oc, get, vm, vm7, -n, "{{ ns }}", -o, "jsonpath={.spec.template.spec.affinity}"]
      register: vm7_affinity_gone
      failed_when: vm7_affinity_gone.stdout != ''
      changed_when: false
